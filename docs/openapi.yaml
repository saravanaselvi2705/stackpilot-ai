openapi: 3.0.3
info:
  title: StackPilot AI Enterprise API Specification
  description: OpenAPI 3.0 documentation for StackPilot AI Enterprise Business & Project Platform.
  version: 1.0.0-rc1
servers:
  - url: http://localhost:5000/api
    description: Local Development Server
  - url: https://app.stackpilot.ai/api
    description: Production API Server

paths:
  /health:
    get:
      summary: Health Check Endpoint
      description: Production health check monitoring status, database connectivity, and uptime.
      responses:
        '200':
          description: Server healthy

  /auth/login:
    post:
      summary: Authenticate User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: JWT Access Token & Profile returned

  /users:
    get:
      summary: Get All Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of users

  /crm/leads:
    get:
      summary: List CRM Leads
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of leads

  /projects:
    get:
      summary: List Projects
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of projects

  /tasks:
    get:
      summary: List Tasks
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of Jira-style tasks

  /finance/invoices:
    get:
      summary: List Invoices
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of invoices

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
