name: StackPilot AI CI Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: TypeScript Verification (Backend API)
        run: npx tsc --noEmit --prefix apps/api

      - name: TypeScript Verification (Frontend Web)
        run: npx tsc -b apps/web

      - name: Production Build
        run: npm run build
